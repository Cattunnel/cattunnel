name: trusttunnel
description: "VPN client for Android, iOS and MacOS, built with Flutter"

publish_to: 'none'
version: 1.4.0+6

workspace:
  - packages/adg_share
  - packages/tray_manager
  - packages/window_manager

environment:
  flutter: 3.38.3
  sdk: 3.10.1

dependencies:
  adg_share:
    path: packages/adg_share
  adguard_logger:
    git:
      url: https://github.com/AdguardTeam/adguard-dart-logger
      ref: v1.0.3
  app_links: 7.0.0
  audioplayers: 6.7.1
  collection: 1.19.1
  cryptography: 2.9.0
  drift: 2.30.0
  file_picker: 10.3.10
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_native_splash: 2.4.7
  html: 0.15.6
  http: 1.2.2
  intl: 0.20.2
  intl_utils: 2.8.13
  local_auth: 3.0.2
  mobile_scanner: 6.0.2
  package_info_plus: 9.0.0
  path_provider: 2.1.6
  punycoder: 0.2.2
  qr_flutter: 4.1.0
  rxdart: 0.28.0
  screen_retriever: 0.2.0
  shared_preferences: 2.5.5
  sqlite3_flutter_libs: 0.5.41
  url_launcher: 6.3.2
  vpn_plugin:
    path: plugins/vpn_plugin
  tray_manager:
    path: packages/tray_manager
  window_manager:
    path: packages/window_manager
  flutter_local_notifications: ^20.1.0
  dage: ^1.0.9
  connectivity_plus: 7.3.1
  video_player: 2.11.1
  # Direct for the default-browser lookup on Windows (TlsProfileAuto); same
  # versions the lock already had transitively.
  ffi: 2.1.5
  win32: 5.15.0

# dage 1.0.9 (pub.dev) computes the age header MAC key with the wrong HKDF
# salt length (see packages/dage/lib/src/header.dart) - breaks decrypting
# anything encrypted by a spec-compliant age implementation. Vendored/patched
# locally until upstream fixes it; not a first-party workspace package.
dependency_overrides:
  dage:
    path: packages/dage

dev_dependencies:
  build_runner: 2.10.4
  drift_dev: 2.30.0
  flutter_launcher_icons: 0.14.4
  flutter_lints: 6.0.0
  flutter_test:
    sdk: flutter
  msix: 3.16.13

flutter_launcher_icons:
  android: true
  ios: true
  macos:
    generate: true
  image_path: "assets/icon/icon_square.png"
  adaptive_icon_background: "#3972AA"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  min_sdk_android: 26

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/tray/
    - assets/images/cats/
    - assets/routing_presets/
    - assets/sounds/
    - assets/video/
    - assets/readme/
    - assets/licenses/
    - LICENSE
    - ENGINE_VERSION
  fonts:
    - family: IconFont
      fonts:
        - asset: assets/fonts/IconFont.ttf
    - family: Roboto
      fonts:
        - asset: assets/fonts/roboto/Roboto-Thin.ttf
          weight: 100
        - asset: assets/fonts/roboto/Roboto-ThinItalic.ttf
          weight: 100
          style: italic
        - asset: assets/fonts/roboto/Roboto-Light.ttf
          weight: 300
        - asset: assets/fonts/roboto/Roboto-LightItalic.ttf
          weight: 300
          style: italic
        - asset: assets/fonts/roboto/Roboto-Regular.ttf
          weight: 400
        - asset: assets/fonts/roboto/Roboto-Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/roboto/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/roboto/Roboto-MediumItalic.ttf
          weight: 500
          style: italic
        - asset: assets/fonts/roboto/Roboto-Bold.ttf
          weight: 700
        - asset: assets/fonts/roboto/Roboto-BoldItalic.ttf
          weight: 700
          style: italic
        - asset: assets/fonts/roboto/Roboto-Black.ttf
          weight: 900
        - asset: assets/fonts/roboto/Roboto-BlackItalic.ttf
          weight: 900
          style: italic

flutter_intl:
  enabled: true
  generate: true
  class_name: AppLocalizations
  main_locale: en
  arb_dir: lib/common/localization/arb
  output_dir: lib/common/localization/generated
  use_deferred_loading: false

msix_config:
  display_name: CatTunnel VPN
  publisher_display_name: CatTunnel
  publisher: CN=CatTunnelDev
  identity_name: com.cattunnel.app
  msix_version: 1.4.0.0
  # The msix tool defaults to 10.0.17763.0 (Windows 10, version 1809), but the
  # package contains a windows.service extension (trusttunnel_service.exe),
  # and service installation via MSIX only works on Windows 10 version 2004
  # (10.0.19041.0) and later — see the "Services packaged in MSIX" section of
  # https://learn.microsoft.com/en-us/windows/msix/desktop/managing-your-msix-deployment-targetdevices
  os_min_version: 10.0.19041.0
  logo_path: assets\icon\icon_square.png
  # runFullTrust is auto-added by the msix tool.
  # packagedServices + localSystemServices enable the windows.service
  # extension so the platform auto-installs trusttunnel_service.exe as SYSTEM.
  # allowElevation is kept for dev scenarios (unpackaged runs).
  capabilities: internetClient,privateNetworkClientServer,allowElevation,packagedServices,localSystemServices
  store: false
  # Test certificate for local development signing.
  # Generate it first: .\windows\msix\Setup-TestCert.ps1
  certificate_path: windows\\msix\\test_cert.pfx
  certificate_password: trusttunnel
