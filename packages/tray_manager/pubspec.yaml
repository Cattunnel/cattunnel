name: tray_manager
version: 0.1.0
publish_to: 'none'

resolution: workspace

description: "TrustTunnel tray API and menu models (macOS status bar, Windows notification area)."

environment:
  sdk: 3.10.1
  flutter: 3.38.3

dependencies:
  dbus: 0.7.12
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: 6.0.0

flutter:
  plugin:
    platforms:
      macos:
        pluginClass: TrayManagerMacosPlugin
      windows:
        pluginClass: TrayManagerPluginCApi
